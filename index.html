<script>
const grid = document.getElementById('school-grid');
const noResults = document.getElementById('no-results');
const countDisplay = document.getElementById('count-display');

function renderSchools(filtered) {
  grid.innerHTML = '';
  const list = filtered || schools;
  countDisplay.textContent = `共 ${list.length} 所`;
  if (list.length === 0) {
    noResults.style.display = 'block';
    grid.style.display = 'none';
    return;
  }
  noResults.style.display = 'none';
  grid.style.display = 'grid';
  list.forEach(s => {
    const card = document.createElement('a');
    card.className = 'card';
    card.href = s.file;
    const diffColor = {"极高":"#c0392b","很高":"#e74c3c","高":"#e67e22","中等偏高":"#f39c12","中等":"#27ae60","中等偏低":"#2980b9"}[s.difficulty] || '#888';
    card.innerHTML = `
      <div class="name">${s.name_cn}</div>
      <div class="en-name">${s.name_en}</div>
      <div class="meta">
        ${s.us_rank && s.us_rank !== '-' ? `<span class="mini-badge mini-us">US #${s.us_rank}</span>` : ''}
        ${s.qs_rank && s.qs_rank !== '-' ? `<span class="mini-badge mini-qs">QS #${s.qs_rank}</span>` : ''}
        <span class="mini-badge mini-diff" style="background:${diffColor}">${s.difficulty}</span>
      </div>
      <div class="location">📍 ${s.location}</div>
    `;
    grid.appendChild(card);
  });
}

function filterSchools() {
  const q = document.getElementById('search').value.toLowerCase();
  if (!q) { renderSchools(); return; }
  const filtered = schools.filter(s =>
    s.name_cn.toLowerCase().includes(q) ||
    s.name_en.toLowerCase().includes(q) ||
    s.location.toLowerCase().includes(q)
  );
  renderSchools(filtered);
}

renderSchools();
</script>
