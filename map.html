function getTier(usn) {
  if (!usn || usn === 'N/A') return 'other';
  var r = parseInt(usn);
  if (r <= 10) return 'top10';
  if (r <= 20) return 'top20';
  if (r <= 30) return 'top30';
  if (r <= 50) return 'top50';
  return 'other';
}

function getColor(tier) {
  var colors = {
    'top10': '#e74c3c',
    'top20': '#e67e22',
    'top30': '#2ecc71',
    'top50': '#3498db',
    'other': '#95a5a6'
  };
  return colors[tier] || '#95a5a6';
}

function getSize(tier) {
  var sizes = { 'top10': 14, 'top20': 12, 'top30': 10, 'top50': 8, 'other': 7 };
  return sizes[tier] || 7;
}

// Create markers by tier
var markersByTier = { top10:[], top20:[], top30:[], top50:[], other:[] };

SCHOOLS.forEach(function(s) {
  var tier = getTier(s.usn_rank);
  var color = getColor(tier);
  var size = getSize(tier);
  
  var usnBadge = s.usn_rank ? '<span class="pop-badge" style="background:#e74c3c">USN #' + s.usn_rank + '</span>' : '';
  var qsBadge = s.qs_rank ? '<span class="pop-badge" style="background:#3498db">QS #' + s.qs_rank + '</span>' : '';
  var diffBadge = s.difficulty ? '<span class="pop-badge" style="background:#2c3e50">' + s.difficulty + '</span>' : '';
  
  var popup = '<div class="popup-school">' +
    '<b>' + s.cn + '</b>' +
    '<div class="pop-en">' + s.en + '</div>' +
    '<div class="pop-meta">' + usnBadge + qsBadge + diffBadge + '</div>' +
    (s.city ? '<div>📍 ' + s.city + '</div>' : '') +
    (s.accept_rate ? '<div>录取率: ' + s.accept_rate + '</div>' : '') +
    (s.tuition ? '<div>学费: ' + s.tuition + '</div>' : '') +
    '<a class="pop-link" href="' + s.file + '" target="_blank">📄 查看完整信息 →</a>' +
    '</div>';
  
  var marker = L.circleMarker([s.lat, s.lon], {
    radius: size,
    fillColor: color,
    color: '#fff',
    weight: 1.5,
    fillOpacity: 0.85
  }).bindPopup(popup);
  
  marker._tier = tier;
  markersByTier[tier].push(marker);
});

// Layer groups
var allMarkers = L.featureGroup();
Object.keys(markersByTier).forEach(function(t) {
  markersByTier[t].forEach(function(m) { allMarkers.addLayer(m); });
});

// Initialize map
var map = L.map('map', {
  center: [39.8, -98.5],
  zoom: 5,
  minZoom: 4,
  maxZoom: 16
});

// Tile layers
var osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  maxZoom: 19
}).addTo(map);

var darkLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
  maxZoom: 19
});

// Toggle between light/dark
var isDark = true;
darkLayer.addTo(map);
map.removeLayer(osmLayer);

// Cluster
var markers = L.markerClusterGroup({
  maxClusterRadius: 60,
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false
});
allMarkers.eachLayer(function(l) { markers.addLayer(l); });
map.addLayer(markers);

// Fit bounds
map.fitBounds(allMarkers.getBounds().pad(0.05));

// Legend
var legend = L.control({position: 'bottomright'});
legend.onAdd = function() {
  var div = L.DomUtil.create('div', 'legend');
  div.innerHTML = '<h4>排名梯队</h4>' +
    '<i style="background:#e74c3c"></i> Top 10 &nbsp;&nbsp;' +
    '<i style="background:#e67e22"></i> Top 20<br>' +
    '<i style="background:#2ecc71"></i> Top 30 &nbsp;&nbsp;' +
    '<i style="background:#3498db"></i> Top 50<br>' +
    '<i style="background:#95a5a6"></i> 50+<br>' +
    '<small style="color:#888">点击圆圈查看详情<br>滚轮缩放 · 拖拽移动</small>';
  return div;
};
legend.addTo(map);

// Filter function
function filterTier(tier) {
  // Update buttons
  document.querySelectorAll('.nav-links a[id^="btn-"]').forEach(function(b) {
    b.classList.remove('active');
  });
  var btn = document.getElementById('btn-' + tier);
  if (btn) btn.classList.add('active');

  markers.clearLayers();
  
  if (tier === 'all') {
    allMarkers.eachLayer(function(l) { markers.addLayer(l); });
  } else {
    markersByTier[tier].forEach(function(m) { markers.addLayer(m); });
  }
  
  document.getElementById('stats').textContent = 
    '显示 ' + Object.keys(markers._layers).length + ' 所学校';
  
  if (Object.keys(markers._layers).length > 0) {
    var group = L.featureGroup();
    Object.values(markers._layers).forEach(function(l) { group.addLayer(l); });
    map.fitBounds(group.getBounds().pad(0.05));
  }
}

// Initial stats
document.getElementById('stats').textContent = '共 ' + SCHOOLS.length + ' 所学校';

// Tile toggle
var tileControl = L.control({position: 'topleft'});
tileControl.onAdd = function() {
  var div = L.DomUtil.create('div', '');
  div.innerHTML = '<button onclick="toggleTheme()" style="background:white;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;box-shadow:0 2px 8px rgba(0,0,0,0.2);">🌓 切换地图</button>';
  return div;
};
tileControl.addTo(map);

function toggleTheme() {
  if (map.hasLayer(darkLayer)) {
    map.removeLayer(darkLayer);
    map.addLayer(osmLayer);
    isDark = false;
  } else {
    map.removeLayer(osmLayer);
    map.addLayer(darkLayer);
    isDark = true;
  }
}
</script>
